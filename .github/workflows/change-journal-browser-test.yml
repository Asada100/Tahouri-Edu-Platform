name: Change Journal Browser Test

on:
  push:
    branches:
      - experiment/local-change-journal-prototype
    paths:
      - 'experiments/change-journal-prototype/**'
      - '.github/scripts/word-puzzle-screen-isolation-test.js'
      - '.github/scripts/word-puzzle-real-engine-iframe-test.js'
      - '.github/scripts/word-puzzle-two-host-transaction-test.js'
      - '.github/scripts/activity-session-manager-real-resume-diagnostic.js'
      - '.github/scripts/session-resume-transaction-test.js'
      - '.github/scripts/change-journal-browser-test.js'
      - '.github/scripts/activity-session-identity-browser-test.js'
      - '.github/scripts/session-identity-browser-test.js'
      - '.github/scripts/session-persistence-migration-test.js'
      - '.github/workflows/change-journal-browser-test.yml'
  pull_request:
    paths:
      - 'experiments/change-journal-prototype/**'
      - '.github/scripts/change-journal-browser-test.js'
      - '.github/scripts/activity-session-identity-browser-test.js'
      - '.github/scripts/session-identity-browser-test.js'
      - '.github/workflows/change-journal-browser-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Change Journal browser tests
        run: node .github/scripts/change-journal-browser-test.js
      - name: Run real storage write-path tests
        run: node .github/scripts/storage-write-path-browser-test.js
      - name: Run activity session identity diagnostic
        run: node .github/scripts/activity-session-identity-browser-test.js
      - name: Run isolated session identity generator tests
        run: node experiments/change-journal-prototype/sessionIdentity.test.js
      - name: Run isolated session persistence guard tests
        run: node experiments/change-journal-prototype/sessionPersistenceGuard.test.js
      - name: Run exact raw storage snapshot contract tests
        run: node experiments/change-journal-prototype/saveManagerRawStorage.test.js
      - name: Run SaveManager to WordPuzzle transaction integration tests
        run: node experiments/change-journal-prototype/saveManagerWordPuzzleTransaction.test.js
      - name: Run isolated session resume transaction tests
        run: node experiments/change-journal-prototype/sessionResumeTransaction.test.js
      - name: Run isolated WordPuzzle restore adapter tests
        run: node experiments/change-journal-prototype/wordPuzzleRestoreAdapter.test.js
      - name: Run isolated WordPuzzle resume transaction matrix
        run: node experiments/change-journal-prototype/wordPuzzleResumeTransaction.test.js
      - name: Run WordPuzzle isolated browsing context proof
        run: node .github/scripts/word-puzzle-screen-isolation-test.js
      - name: Run actual WordPuzzle engine iframe proof
        run: node .github/scripts/word-puzzle-real-engine-iframe-test.js
      - name: Run WordPuzzle two-host transaction proof
        run: node .github/scripts/word-puzzle-two-host-transaction-test.js
      - name: Run actual ActivitySessionManager resume diagnostics
        run: node .github/scripts/activity-session-manager-real-resume-diagnostic.js
      - name: Run runtime-compatible legacy session validator tests
        run: node experiments/change-journal-prototype/legacySessionValidator.test.js
      - name: Run isolated legacy session migration tests
        run: node experiments/change-journal-prototype/legacySessionMigrator.test.js
      - name: Run session identity browser tests
        run: node .github/scripts/session-identity-browser-test.js
      - name: Run session persistence and migration diagnostics
        run: node .github/scripts/session-persistence-migration-test.js
      - name: Run session resume transaction diagnostics
        run: node .github/scripts/session-resume-transaction-test.js
