name: Deploy isolated Tahouri license Worker

on:
  push:
    branches:
      - test/worker-signature-self-check
    paths:
      - "services/license-api/worker.js"
      - "services/license-api/activation-service.js"
      - "services/license-api/entitlement-crypto.js"
      - "services/license-api/admin/**"
      - "services/license-api/wrangler.test.jsonc"
      - ".github/workflows/deploy-license-worker-test.yml"

permissions:
  contents: read

concurrency:
  group: tahouri-license-worker-isolated-test
  cancel-in-progress: false

jobs:
  deploy-test-worker:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: "2390ebe93771d1ce9162e621e7c60599"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test/worker-signature-self-check

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify isolated test configuration
        run: node services/license-api/assert-test-config.mjs

      - name: Deploy only the isolated test Worker
        run: npx --yes wrangler@4.156.2 deploy --config services/license-api/wrangler.test.jsonc
