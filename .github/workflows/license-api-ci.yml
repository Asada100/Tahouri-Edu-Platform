name: License API CI

on:
  push:
    paths:
      - "services/license-api/**"
      - "engine/core/licenseManager.js"
      - "engine/core/activationGate.js"
      - "engine/core/tahouriEntitlementStore.js"
      - "engine/core/tahouriEntitlementVerifier.js"
      - "engine/core/tahouriServiceConfig.js"
      - "index.html"
      - ".github/workflows/license-api-ci.yml"
  pull_request:
    paths:
      - "services/license-api/**"
      - "engine/core/tahouriEntitlementVerifier.js"
      - "engine/core/tahouriServiceConfig.js"
      - ".github/workflows/license-api-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/license-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Release artifact check
        run: npm run release-check

      - name: Security test
        run: npm run security-test

      - name: Cloudflare Worker global-session revocation test
        run: node worker-session-revocation-test.mjs

      - name: Cloudflare Worker student registry and bound activation test
        run: node worker-activation-test.js

      - name: Client license safety test
        run: node client-license-safety-test.js

      - name: Production entitlement public-key verification test
        run: npm run client-verifier-test

      - name: Read-only production public-key endpoint smoke test
        run: node production-public-key-smoke-test.mjs

      - name: Profile-aware entitlement regression test
        run: node license-manager-mode-test.js

      - name: Integration test
        run: npm run integration-test
      - name: Migration verification
        run: npm run migration-test
      - name: Backup and recovery verification
        run: npm run backup-recovery-test
