name: License API CI

on:
  push:
    paths:
      - "services/license-api/**"
      - "engine/core/licenseManager.js"
      - "engine/core/activationGate.js"
      - "engine/core/tahouriEntitlementStore.js"
      - "engine/core/tahouriEntitlementVerifier.js"
      - "engine/core/tahouriServiceConfig.js"
      - "index.html"
      - ".github/workflows/license-api-ci.yml"
  pull_request:
    paths:
      - "services/license-api/**"
      - "engine/core/tahouriEntitlementVerifier.js"
      - "engine/core/tahouriServiceConfig.js"
      - ".github/workflows/license-api-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/license-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Release artifact check
        run: npm run release-check

      - name: Security test
        run: npm run security-test

      - name: Cloudflare Worker global-session revocation test
        run: node worker-session-revocation-test.mjs

      - name: Cloudflare Worker student registry and bound activation test
        run: node worker-activation-test.js

      - name: Client license safety test
        run: node client-license-safety-test.js

      - name: Production entitlement public-key verification test
        run: npm run client-verifier-test

      - name: Read-only production public-key endpoint smoke test
        run: node production-public-key-smoke-test.mjs

      - name: Profile-aware entitlement regression test
        run: node license-manager-mode-test.js

      - name: Client-to-profile activation flow test
        run: npm run client-profile-activation-test

      - name: Integration test
        run: npm run integration-test
      - name: Migration verification
        run: npm run migration-test
      - name: Backup and recovery verification
        run: npm run backup-recovery-test

  isolated-d1-worker-http-e2e:
    name: Isolated Cloudflare Worker HTTP race test
    # The test endpoint resets a shared isolated D1 fixture; serialize all invocations.
    concurrency:
      group: tahouri-isolated-worker-http-race
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify isolated Worker health and D1 binding
        run: |
          curl --fail-with-body --silent --show-error \
            "https://tahouri-activation-race-test-20261115.asadtahouri1986.workers.dev/health" \
            | jq -e '.ok == true and .presentTables == .expectedTables'

      - name: Run ten concurrent activation races through the deployed Worker
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            response="$(curl --fail-with-body --silent --show-error \
              -X POST \
              -H "content-type: application/json" \
              --data '{}' \
              "https://tahouri-activation-race-test-20261115.asadtahouri1986.workers.dev/run")"
            echo "$response" | jq -e '
              .ok == true and
              (.outcomes | map(select(.status == 200)) | length) == 1 and
              (.outcomes | map(select(.status == 409)) | length) == 1 and
              (.outcomes | map(select(.status == 200))[0].changes == [1,1,1,1]) and
              (.outcomes | map(select(.status == 409))[0].changes == [0,0,0,0]) and
              .finalState.licenseCount == 1 and
              .finalState.auditCount == 1 and
              .finalState.studentActivationStatus == "active" and
              .finalState.activationCode.status == "used" and
              ([.assertions[]] | all)
            ' >/dev/null
            echo "Worker HTTP race iteration $attempt/10: PASS"
          done
