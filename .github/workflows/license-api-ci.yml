name: License API CI

on:
  push:
    paths:
      - "services/license-api/**"
      - "engine/core/licenseManager.js"
      - "engine/core/activationGate.js"
      - "engine/core/appController.js"
      - "engine/core/tahouriEntitlementStore.js"
      - "engine/core/tahouriEntitlementVerifier.js"
      - "engine/core/tahouriServiceConfig.js"
      - "index.html"
      - "engine/core/tahouriDeviceIdentity.js"
      - "engine/core/tahouriDeviceIdentity-test.html"
      - "services/license-api/device-identity-test-server.mjs"
      - ".github/scripts/device-identity-browser-test.js"
      - ".github/workflows/license-api-ci.yml"
  pull_request:
    paths:
      - "services/license-api/**"
      - "engine/core/licenseManager.js"
      - "engine/core/activationGate.js"
      - "engine/core/appController.js"
      - "index.html"
      - "engine/core/tahouriEntitlementVerifier.js"
      - "engine/core/tahouriServiceConfig.js"
      - ".github/workflows/license-api-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/license-api

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Release artifact check
        run: npm run release-check

      - name: Security test
        run: npm run security-test

      - name: Cloudflare Worker global-session revocation test
        run: node worker-session-revocation-test.mjs

      - name: Cloudflare Worker student registry and bound activation test
        run: node worker-activation-test.js

      - name: Install isolated browser test runner
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.65.1
          npx playwright install chromium

      - name: Admin browser end-to-end import and activation test
        run: |
          node admin-browser-e2e-server.mjs > "$RUNNER_TEMP/tahouri-browser-e2e-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if node -e 'fetch("http://127.0.0.1:8787/__test/health").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'; then
              break
            fi
            sleep 1
          done
          node admin-browser-e2e-test.mjs


      - name: Device identity cryptographic browser test
        run: |
          node device-identity-test-server.mjs > "$RUNNER_TEMP/device-identity-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if node -e 'fetch("http://127.0.0.1:4173/test").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'; then
              break
            fi
            sleep 1
          done
          NODE_PATH="$PWD/node_modules" node ../../.github/scripts/device-identity-browser-test.js
      - name: Client license safety test
        run: node client-license-safety-test.js

      - name: Client legacy migration behavior test
        run: node client-legacy-migration-test.js

      - name: Content-lock legacy migration ownership-safety regression
        run: node content-lock-legacy-migration-reproduction-test.js

      - name: Client-to-Worker legacy migration end-to-end test
        run: npm run client-worker-migration-e2e-test

      - name: Pairing result UI regression test
        run: node license-screen-pairing-ui-test.js

      - name: Production entitlement public-key verification test
        run: npm run client-verifier-test

      - name: Read-only production public-key endpoint smoke test
        run: node production-public-key-smoke-test.mjs

      - name: Verify pinned client key against production Worker
        run: node production-public-key-pin-test.mjs

      - name: Production Worker health and D1 readiness smoke test
        run: npm run production-readiness-smoke

      - name: Profile-aware entitlement regression test
        run: node license-manager-mode-test.js

      - name: Client-to-profile activation flow test
        run: npm run client-profile-activation-test

      - name: Profile legacy migration handoff behavior test
        run: node profile-legacy-migration-handoff-test.js

      - name: Activity session portability contract test
        run: node activity-session-contract-test.js

      - name: Student learning data portability regression test
        run: node student-data-transfer-test.js

      - name: Integration test
        run: npm run integration-test
      - name: Migration verification
        run: npm run migration-test
      - name: Backup and recovery verification
        run: npm run backup-recovery-test
