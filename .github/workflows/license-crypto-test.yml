name: License entitlement and D1 migration tests

on:
  push:
    branches:
      - chore/cloudflare-worker-source-baseline
    paths:
      - "services/license-api/cloudflare/tests/*.test.mjs"
      - "services/license-api/cloudflare/activation-policy.js"
      - "services/license-api/cloudflare/migrations/*.sql"
      - ".github/workflows/license-crypto-test.yml"
  pull_request:
    paths:
      - "services/license-api/cloudflare/tests/*.test.mjs"
      - "services/license-api/cloudflare/migrations/*.sql"
      - ".github/workflows/license-crypto-test.yml"

permissions:
  contents: read

jobs:
  license-safety-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run isolated license safety tests
        run: node --test services/license-api/cloudflare/tests/*.test.mjs
