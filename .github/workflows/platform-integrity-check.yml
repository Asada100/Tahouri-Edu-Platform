name: Platform Integrity Check

on:
  push:
    paths:
      - "index.html"
      - "service-worker.js"
      - "engine/**"
      - "content/**"
      - "data/**"
      - "assets/**"
      - "services/license-api/**"
      - "scripts/**"
      - ".github/workflows/platform-integrity-check.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "index.html"
      - "service-worker.js"
      - "engine/**"
      - "content/**"
      - "data/**"
      - "assets/**"
      - "services/license-api/**"
      - "scripts/**"
      - ".github/workflows/platform-integrity-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate all JavaScript, JSON, and platform references
        run: node scripts/platform-integrity-check.js
