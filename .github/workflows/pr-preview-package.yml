name: PR Preview Package

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Package static site for local preview
        run: |
          zip -r "$RUNNER_TEMP/tahouri-preview.zip" . \
            -x ".git/*" \
            -x "node_modules/*" \
            -x ".github/*"

      - name: Upload preview package
        uses: actions/upload-artifact@v4
        with:
          name: tahouri-even-odd-sum-preview
          path: ${{ runner.temp }}/tahouri-preview.zip
          if-no-files-found: error
          retention-days: 7
