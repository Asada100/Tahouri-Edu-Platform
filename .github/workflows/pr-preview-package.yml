name: PR Preview Package

on:
  pull_request:
    branches:
      - master
      - integration/security-release-gates-117-118-119-20261115
      - fix/integrated-production-public-key-pin-20261116
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - integration/security-release-gates-117-118-119-20261115
      - fix/integrated-production-public-key-pin-20261116
      - test/integrated-security-public-key-browser-e2e-20261116
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out pull request code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Package static site for local preview
        run: |
          zip -r "$RUNNER_TEMP/tahouri-preview.zip" . \
            -x ".git/*" \
            -x "node_modules/*" \
            -x ".github/*"

      - name: Upload preview package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tahouri-even-odd-sum-preview
          path: ${{ runner.temp }}/tahouri-preview.zip
          if-no-files-found: error
          retention-days: 7
