name: PR Preview Package

on:
  pull_request:
    branches:
      - master
      - integration/security-release-gates-117-118-119-20261115
      - fix/integrated-production-public-key-pin-20261116
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - implementation/one-phone-one-pc
      - integration/security-release-gates-117-118-119-20261115
      - fix/integrated-production-public-key-pin-20261116
      - test/integrated-security-public-key-browser-e2e-20261116
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out pull request code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify isolated PR141 preview configuration
        env:
          PR141_PREVIEW_API_BASE_URL: https://tahouri-pr141-device-e2e-20261119.asadtahouri1986.workers.dev/api
        run: |
          TEST_DIR="$RUNNER_TEMP/pr141-config-test"
          mkdir -p "$TEST_DIR"
          cp engine/core/tahouriServiceConfig.js "$TEST_DIR/config.js"
          node .github/scripts/configure-pr141-preview.mjs "$TEST_DIR/config.js"
          grep -F 'mode: "pr141-isolated-test"' "$TEST_DIR/config.js"
          grep -F 'apiBaseUrl: "https://tahouri-pr141-device-e2e-20261119.asadtahouri1986.workers.dev/api"' "$TEST_DIR/config.js"
          grep -F 'publicKeyPem: ""' "$TEST_DIR/config.js"
          if grep -F 'tahouri-license-api.asadtahouri1986.workers.dev' "$TEST_DIR/config.js"; then
            echo "Production Worker URL remained in preview config" >&2
            exit 1
          fi

      - name: Package isolated PR141 static preview
        env:
          PR141_PREVIEW_API_BASE_URL: https://tahouri-pr141-device-e2e-20261119.asadtahouri1986.workers.dev/api
        run: |
          STAGE="$RUNNER_TEMP/tahouri-pr141-preview"
          mkdir -p "$STAGE"
          cp -a . "$STAGE/"
          node .github/scripts/configure-pr141-preview.mjs "$STAGE/engine/core/tahouriServiceConfig.js"
          (cd "$STAGE" && zip -r "$RUNNER_TEMP/tahouri-preview.zip" . \
            -x ".git/*" \
            -x "node_modules/*" \
            -x ".github/*")

      - name: Upload preview package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tahouri-pr141-isolated-preview
          path: ${{ runner.temp }}/tahouri-preview.zip
          if-no-files-found: error
          retention-days: 7
