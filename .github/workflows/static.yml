# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["master"]

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recover PuzzleScreen from known-good commit
        run: |
          git show 4b2b398e27b6a4db5478515f4c3b9d2880e52b65:engine/ui/puzzleScreen.js > engine/ui/puzzleScreen.js
          git show 4b2b398e27b6a4db5478515f4c3b9d2880e52b65:.github/workflows/static.yml > .github/workflows/static.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/ui/puzzleScreen.js .github/workflows/static.yml
          git commit -m "Recover PuzzleScreen and restore deployment workflow" || exit 0
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
