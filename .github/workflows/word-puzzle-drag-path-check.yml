name: Word Puzzle Drag Path Checks

on:
  pull_request:
    branches: ["master"]
    paths:
      - "engine/wordPuzzle/**"
      - "engine/ui/wordPuzzleScreen.js"
      - "engine/ui/wordPuzzle.css"
      - "index.html"
      - "tests/word-puzzle-drag-path.test.js"
      - ".github/workflows/word-puzzle-drag-path-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  word-puzzle-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check engine/wordPuzzle/wordPuzzleEngine.js
          node --check engine/ui/wordPuzzleScreen.js
          node --check tests/word-puzzle-drag-path.test.js
      - name: Test connected letter paths and answer display
        run: node tests/word-puzzle-drag-path.test.js
