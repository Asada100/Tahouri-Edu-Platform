services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      TAHOURI_API_DOMAIN: ${TAHOURI_API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/license-api/Caddyfile.production.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      tahouri-license-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

  tahouri-license-api:
    build:
      context: .
      dockerfile: services/license-api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8787
      HOST: 0.0.0.0
      TAHOURI_LICENSE_PRIVATE_KEY_FILE: /run/secrets/tahouri_private_key
      TAHOURI_BACKUP_SIGNING_PRIVATE_KEY_FILE: /run/secrets/tahouri_backup_signing_private_key
      TAHOURI_BACKUP_SIGNING_PUBLIC_KEY_FILE: /run/secrets/tahouri_backup_signing_public_key
      TAHOURI_BACKUP_OFFSITE_HOST: ${TAHOURI_BACKUP_OFFSITE_HOST}
      TAHOURI_BACKUP_OFFSITE_USER: ${TAHOURI_BACKUP_OFFSITE_USER}
      TAHOURI_BACKUP_OFFSITE_DIR: ${TAHOURI_BACKUP_OFFSITE_DIR}
      TAHOURI_BACKUP_OFFSITE_SSH_KEY_FILE: /run/secrets/tahouri_backup_offsite_ssh_key
      TAHOURI_ADMIN_PASSWORD: ${TAHOURI_ADMIN_PASSWORD}
      TAHOURI_PAYMENT_PROVIDER: ${TAHOURI_PAYMENT_PROVIDER}
      TAHOURI_ADMIN_ORIGIN: ${TAHOURI_ADMIN_ORIGIN}
      TAHOURI_APP_ORIGIN: ${TAHOURI_APP_ORIGIN}
      TAHOURI_API_DOMAIN: ${TAHOURI_API_DOMAIN}
      TAHOURI_PAYMENT_CALLBACK_URL: ${TAHOURI_PAYMENT_CALLBACK_URL}
      TAHOURI_PAYMENT_MERCHANT_ID: ${TAHOURI_PAYMENT_MERCHANT_ID}
      TAHOURI_PAYMENT_API_KEY: ${TAHOURI_PAYMENT_API_KEY}
      TAHOURI_LICENSE_DB_FILE: /data/license.sqlite
      TAHOURI_LICENSE_BACKUP_DIR: /backups
    volumes:
      - tahouri_license_data:/data
      - tahouri_license_backups:/backups
    secrets:
      - tahouri_private_key
      - tahouri_backup_signing_private_key
      - tahouri_backup_signing_public_key
      - tahouri_backup_offsite_ssh_key
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  tahouri-backup-scheduler:
    build:
      context: .
      dockerfile: services/license-api/Dockerfile
    restart: unless-stopped
    command: ["node", "services/license-api/backup-scheduler.js"]
    environment:
      NODE_ENV: production
      TAHOURI_BACKUP_INTERVAL_HOURS: ${TAHOURI_BACKUP_INTERVAL_HOURS:-24}
      TAHOURI_LICENSE_DB_FILE: /data/license.sqlite
      TAHOURI_LICENSE_BACKUP_DIR: /backups
      TAHOURI_BACKUP_SIGNING_PRIVATE_KEY_FILE: /run/secrets/tahouri_backup_signing_private_key
      TAHOURI_BACKUP_SIGNING_PUBLIC_KEY_FILE: /run/secrets/tahouri_backup_signing_public_key
      TAHOURI_BACKUP_OFFSITE_HOST: ${TAHOURI_BACKUP_OFFSITE_HOST}
      TAHOURI_BACKUP_OFFSITE_USER: ${TAHOURI_BACKUP_OFFSITE_USER}
      TAHOURI_BACKUP_OFFSITE_DIR: ${TAHOURI_BACKUP_OFFSITE_DIR}
      TAHOURI_BACKUP_OFFSITE_SSH_KEY_FILE: /run/secrets/tahouri_backup_offsite_ssh_key
    volumes:
      - tahouri_license_data:/data:ro
      - tahouri_license_backups:/backups
    secrets:
      - tahouri_backup_signing_private_key
      - tahouri_backup_signing_public_key
      - tahouri_backup_offsite_ssh_key

secrets:
  tahouri_private_key:
    file: ./secrets/tahouri-license-private.pem
  tahouri_backup_signing_private_key:
    file: ./secrets/tahouri-backup-signing-private.pem
  tahouri_backup_signing_public_key:
    file: ./secrets/tahouri-backup-signing-public.pem
  tahouri_backup_offsite_ssh_key:
    file: ./secrets/tahouri-backup-offsite-ssh

volumes:
  caddy_data:
  caddy_config:
  tahouri_license_data:
  tahouri_license_backups:

networks:
  default:
    name: tahouri-production
