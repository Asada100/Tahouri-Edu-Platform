<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Activity Session Identity Diagnostic</title></head>
<body><h1>Activity Session Identity Diagnostic</h1><div id="summary">running</div><ol id="results"></ol>
<script>
(function(){
  const store = new Map();
  let activeProfile = "PROFILE_A";
  window.ProfileContext = {
    key(base){ return base + ":" + activeProfile; },
    getStudentId(){ return activeProfile; }
  };
  window.SaveManager = {
    load(key){ if(!store.has(key))return null;try{return JSON.parse(store.get(key));}catch(_){return null;} },
    save(key,value){ store.set(key, JSON.stringify(value)); return true; },
    readRaw(key){return store.has(key)?{ok:true,exists:true,value:store.get(key)}:{ok:true,exists:false,value:null};},
    writeRaw(key,value){if(!key||typeof value!=="string")return false;store.set(key,value);return true;},
    restoreRaw(key,snapshot){if(!snapshot)return false;if(snapshot.exists)store.set(key,snapshot.value);else store.delete(key);return true;},
    remove(key){ store.delete(key); return true; }
  };
  window.EventManager = { on(){}, emit(){} };
  document.addEventListener = function(){};
  window.addEventListener = function(){};
  window.__identityStore = store;
  window.__setProfile = value => { activeProfile = value; };
})();
</script>
<script src="../../engine/activity/activitySessionManager.js"></script>
<script>
(function(){
  const manager = window.ActivitySessionManager;
  const results = document.getElementById("results");
  const checks = [];
  const originalNow = Date.now;
  const activity = {id:"identity-audit-activity", engine:"QuizEngine"};
  function add(name, outcome, detail, blocker=false){ checks.push({name,outcome,detail,blocker}); }
  try {
    Date.now = () => 1700000000000;
    manager.currentSession = null;
    const first = manager.begin(activity);
    const firstId = first.id;
    const firstStored = window.__identityStore.get("Tahouri_ActivitySession:PROFILE_A");
    add("A1 session is persisted before engine start", !!firstStored && firstStored.id === firstId, firstId);

    first.status = "resumable";
    first.engineState = {kind:"quiz",state:{},questions:[{id:"q1"}],currentQuestion:0};
    manager.save(first);
    manager.currentSession = null;
    const restoredSnapshot = manager.load(activity.id);
    add("A2 saved resumable session retains its ID on load", !!restoredSnapshot && restoredSnapshot.id === firstId, restoredSnapshot && restoredSnapshot.id);

    manager.clear();
    const restartedSameTick = manager.begin(activity);
    add("A3 same-tick restart generates a distinct ID", restartedSameTick.id !== firstId,
      restartedSameTick.id === firstId ? "timestamp collision reproduced" : "distinct cryptographic ID");

    manager.clear();
    window.__setProfile("PROFILE_B");
    manager.currentSession = null;
    const profileB = manager.begin(activity);
    add("A4 same activity/time across profiles has distinct global ID", profileB.id !== restartedSameTick.id,
      profileB.id === restartedSameTick.id ? "profile-independent ID collision reproduced" : "distinct cryptographic ID");

    Date.now = () => 1700000000001;
    manager.clear();
    const laterAttempt = manager.begin(activity);
    add("A5 later attempt produces a different ID", laterAttempt.id !== profileB.id, laterAttempt.id);

    manager.clear();
    const originalGenerator = manager.generateSessionId;
    manager.generateSessionId = () => { throw new Error("secure randomness unavailable"); };
    const blocked = manager.begin({id:"identity-no-crypto",engine:"QuizEngine"});
    manager.generateSessionId = originalGenerator;
    add("A6 missing secure randomness fails closed", blocked === null && manager.currentSession === null,
      blocked === null ? "no session published" : "session incorrectly created");
  } catch(error) {
    add("Harness execution", false, error.stack || error.message);
  } finally {
    Date.now = originalNow;
  }
  let passed = 0;
  for (const item of checks) {
    const li = document.createElement("li");
    li.textContent = (item.blocker ? "BLOCKER CONFIRMED — " : item.outcome ? "PASS — " : "FAIL — ") + item.name + " — " + item.detail;
    results.appendChild(li);
    if (item.outcome) passed++;
  }
  const blockers = checks.filter(item => item.blocker).length;
  document.getElementById("summary").textContent = passed + "/" + checks.length + " diagnostic checks executed; " + blockers + " known blockers confirmed";
  window.__identityDiagnostic = {passed,total:checks.length,blockers,checks};
})();
</script></body></html>
