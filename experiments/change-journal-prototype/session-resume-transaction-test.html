<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Session Resume Transaction Diagnostics</title></head>
<body><h1>Session Resume Transaction Diagnostics</h1><p id="summary">running</p><ol id="results"></ol><div id="app">previous-screen</div>
<script>
(function(){
  const stored={raw:null,failSave:false};
  window.ProfileContext={key(){return "Tahouri_ActivitySession:TEST_PROFILE";},getStudentId(){return "TEST_PROFILE";}};
  window.SaveManager={
    load(){if(stored.raw===null)return null;try{return JSON.parse(stored.raw);}catch(_){return null;}},
    save(key,value){if(stored.failSave)return false;stored.raw=JSON.stringify(value);return true;},
    remove(){stored.raw=null;return true;}
  };
  window.EventManager={events:[],on(){},emit(name,payload){this.events.push({name,payload});}};
  window.ActivityManager={currentActivity:null};
  window.ActivityState={value:"idle",set(value){this.value=value;}};
  document.addEventListener=function(){};
  window.addEventListener=function(){};
  window.__resumeDiag=stored;
})();
</script>
<script src="../../engine/activity/activitySessionManager.js"></script>
<script src="../../engine/wordPuzzle/wordPuzzleEngine.js"></script>
<script>
(async function(){
  const manager=window.ActivitySessionManager, d=window.__resumeDiag, results=[];
  const actualRestoreEngine=manager.restoreEngine;
  const activity={id:"resume-diagnostic-activity",engine:"QuizEngine"};
  const validSession=()=>({version:"1.9",schemaVersion:1,id:"legacy-session-id",profileId:"TEST_PROFILE",activityId:activity.id,activityType:"QuizEngine",status:"resumable",startedAt:1,updatedAt:1,engineState:{kind:"quiz",state:{started:true},questions:[{id:"q1",text:"sample"}],currentQuestion:0,score:4,correct:1,wrong:0}});
  const sentinel={id:"previous-in-memory-session",status:"active"};
  function record(name,reproduced,detail){results.push({name,reproduced,detail});}
  manager.installExitControl=function(){};
  manager.hideOverlay=function(){};
  window.App={resolveActivityById(id){return id===activity.id?activity:null;}};
  try{
    // A failed restore must not publish the attempted target over existing in-memory state.
    const failed=validSession(); d.raw=JSON.stringify(failed); manager.currentSession=sentinel;
    manager.getResumable=()=>failed;
    manager.restoreEngine=async()=>false;
    const falseResult=await manager.resume(activity.id);
    record("R1 false restore must preserve prior currentSession",
      falseResult===false && manager.currentSession===failed,
      "resume() returned false but left the failed target published as currentSession instead of restoring the previous reference");

    // A thrown restore must also roll back the attempted target and restore flag.
    const thrown=validSession(); d.raw=JSON.stringify(thrown); manager.currentSession=sentinel;
    manager.getResumable=()=>thrown;
    manager.restoreEngine=async()=>{throw new Error("synthetic restore failure");};
    let threw=false;try{await manager.resume(activity.id);}catch(_){threw=true;}
    record("R2 thrown restore must preserve prior currentSession",
      threw && manager.currentSession===thrown && manager.restoringSession===false,
      "restore exception propagated and restoringSession reset, but currentSession remained the failed target");

    // Successful in-memory restore is not a committed resume if persistence fails.
    const success=validSession(); d.raw=JSON.stringify(success); d.failSave=true;
    manager.currentSession=null; manager.gameplayActive=false; manager.getResumable=()=>success;
    ActivityManager.currentActivity=null; ActivityState.value="idle";
    document.body.classList.remove("activity-playing"); EventManager.events.length=0;
    manager.restoreEngine=async()=>{manager.activateRestoredActivity(activity);return true;};
    const returned=await manager.resume(activity.id);
    const persisted=JSON.parse(d.raw);
    const resumedEvents=EventManager.events.filter(event=>event.name==="activityResumed").length;
    const leakedRuntime=manager.gameplayActive===true && document.body.classList.contains("activity-playing") &&
      ActivityManager.currentActivity===activity && ActivityState.value==="playing" && resumedEvents===1;
    record("R3 failed status write must roll back all published runtime effects",
      returned===true && success.status==="active" && persisted.status==="resumable" && leakedRuntime,
      "resume() returned success, changed memory to active, left persisted status resumable, enabled gameplay/CSS, published ActivityManager and ActivityState, and emitted activityResumed despite SaveManager.save() failure");
    d.failSave=false;

    // R4 exercises the real Quiz restore branch, not a restoreEngine stub.
    const quizEngine={
      activity:{id:"old-activity"},questions:[{id:"old-q",text:"old"}],currentQuestion:0,
      state:{started:false},getQuestion(){return this.questions[this.currentQuestion]||null;}
    };
    window.EngineManager={getEngine(name){return name==="QuizEngine"?quizEngine:null;}};
    window.ScoreManager={score:2,correct:1,wrong:3};
    window.QuizScreen={
      isLocked:false,reset(){this.isLocked=false;},
      show(payload){document.getElementById("app").innerHTML="restored-quiz:"+payload.question.text;}
    };
    manager.restoreEngine=actualRestoreEngine;
    const actualSession=validSession();
    actualSession.engineState={kind:"quiz",activity,questions:[{id:"q-real",text:"real-question"}],
      currentQuestion:0,state:{started:true},score:77,correct:7,wrong:1};
    d.raw=JSON.stringify(actualSession);d.failSave=true;
    manager.currentSession=null;manager.gameplayActive=false;manager.getResumable=()=>actualSession;
    ActivityManager.currentActivity=null;ActivityState.value="idle";
    document.body.classList.remove("activity-playing");EventManager.events.length=0;
    document.getElementById("app").innerHTML="previous-screen";
    const realReturned=await manager.resume(activity.id);
    const realPersisted=JSON.parse(d.raw);
    const realEventCount=EventManager.events.filter(event=>event.name==="activityResumed").length;
    const realLeaked=manager.gameplayActive===true && document.body.classList.contains("activity-playing") &&
      ActivityManager.currentActivity===activity && ActivityState.value==="playing" && realEventCount===1 &&
      document.getElementById("app").innerHTML==="restored-quiz:real-question" &&
      ScoreManager.score===77 && quizEngine.currentQuestion===0;
    record("R4 real Quiz restore branch leaks UI/score/activity when persistence fails",
      realReturned===true && actualSession.status==="active" && realPersisted.status==="resumable" && realLeaked,
      "actual restoreEngine() rebuilt quiz UI and score, activated activity, then resume() ignored failed durable write and emitted activityResumed");
    d.failSave=false;

    // R5 exercises the real Memory restore branch and its rendered UI on failed persistence.
    const memoryEngine={activity:{id:"old-memory"},cards:[{id:"old-card"}],firstCard:null,secondCard:null,
      lockBoard:true,matchedPairs:0,moves:0,totalPairs:1,finished:true};
    window.EngineManager={getEngine(name){return name==="MemoryEngine"?memoryEngine:null;}};
    window.ScoreManager={score:3,correct:1,wrong:2};
    window.MemoryScreen={show(payload){
      document.getElementById("app").innerHTML="restored-memory:"+payload.cards[0].id;
      return true;
    }};
    const memorySession=validSession();
    activity.engine="MemoryEngine";
    memorySession.activityType="MemoryEngine";
    memorySession.engineState={kind:"memory",activity,cards:[{id:"memory-card-1",matched:false}],
      matchedPairs:0,moves:4,totalPairs:3,score:88,correct:8,wrong:2};
    d.raw=JSON.stringify(memorySession);d.failSave=true;
    manager.currentSession=null;manager.gameplayActive=false;manager.getResumable=()=>memorySession;
    ActivityManager.currentActivity=null;ActivityState.value="idle";
    document.body.classList.remove("activity-playing");EventManager.events.length=0;
    document.getElementById("app").innerHTML="previous-screen";
    const memoryReturned=await manager.resume(activity.id);
    const memoryPersisted=JSON.parse(d.raw);
    const memoryEvents=EventManager.events.filter(event=>event.name==="activityResumed").length;
    const memoryLeaked=manager.gameplayActive===true && document.body.classList.contains("activity-playing") &&
      ActivityManager.currentActivity===activity && ActivityState.value==="playing" && memoryEvents===1 &&
      document.getElementById("app").innerHTML==="restored-memory:memory-card-1" &&
      ScoreManager.score===88 && memoryEngine.moves===4 && memoryEngine.finished===false;
    record("R5 real Memory restore branch leaks UI/score/activity when persistence fails",
      memoryReturned===true && memorySession.status==="active" && memoryPersisted.status==="resumable" && memoryLeaked,
      "observed returned="+memoryReturned+", memoryStatus="+memorySession.status+", persistedStatus="+memoryPersisted.status+", gameplayActive="+manager.gameplayActive+", css="+document.body.classList.contains("activity-playing")+", currentActivity="+(ActivityManager.currentActivity===activity)+", activityState="+ActivityState.value+", events="+memoryEvents+", markup="+document.getElementById("app").innerHTML+", score="+ScoreManager.score+", moves="+memoryEngine.moves+", finished="+memoryEngine.finished);
    d.failSave=false;

    // R6 exercises the real Puzzle restore branch and visible UI on failed persistence.
    const puzzleEngine={activity:{id:"old-puzzle"},state:{started:false},puzzle:{type:"sequence",items:[]},
      items:[{id:"old-item"}],userAnswer:"",moves:0,getState(){return {puzzle:this.puzzle,items:this.items,moves:this.moves};}};
    activity.engine="PuzzleEngine";
    window.EngineManager={getEngine(name){return name==="PuzzleEngine"?puzzleEngine:null;}};
    window.ScoreManager={score:5,correct:1,wrong:1};
    window.PuzzleScreen={show(payload){
      document.getElementById("app").innerHTML="puzzleScreen:restored-puzzle:"+payload.items[0].id;
      return true;
    }};
    const puzzleSession=validSession();
    puzzleSession.activityType="PuzzleEngine";
    puzzleSession.engineState={kind:"puzzle",activity,state:{started:true},
      puzzle:{type:"sequence",items:[{id:"puzzle-item-1"}]},
      items:[{id:"puzzle-item-1"}],userAnswer:"answer",moves:6};
    d.raw=JSON.stringify(puzzleSession);d.failSave=true;
    manager.currentSession=null;manager.gameplayActive=false;manager.getResumable=()=>puzzleSession;
    ActivityManager.currentActivity=null;ActivityState.value="idle";
    document.body.classList.remove("activity-playing");EventManager.events.length=0;
    document.getElementById("app").innerHTML="previous-screen";
    const puzzleReturned=await manager.resume(activity.id);
    const puzzlePersisted=JSON.parse(d.raw);
    const puzzleEvents=EventManager.events.filter(event=>event.name==="activityResumed").length;
    const puzzleLeaked=manager.gameplayActive===true && document.body.classList.contains("activity-playing") &&
      ActivityManager.currentActivity===activity && ActivityState.value==="playing" && puzzleEvents===1 &&
      document.getElementById("app").innerHTML==="puzzleScreen:restored-puzzle:puzzle-item-1" &&
      puzzleEngine.moves===6 && puzzleEngine.userAnswer==="answer";
    record("R6 real Puzzle restore branch leaks UI/activity when persistence fails",
      puzzleReturned===true && puzzleSession.status==="active" && puzzlePersisted.status==="resumable" && puzzleLeaked,
      "observed returned="+puzzleReturned+", status="+puzzleSession.status+", persisted="+puzzlePersisted.status+", gameplayActive="+manager.gameplayActive+", css="+document.body.classList.contains("activity-playing")+", currentActivity="+(ActivityManager.currentActivity===activity)+", activityState="+ActivityState.value+", events="+puzzleEvents+", markup="+document.getElementById("app").innerHTML+", moves="+puzzleEngine.moves+", answer="+puzzleEngine.userAnswer);
    d.failSave=false;

    // R7 exercises the real Dictation restore branch and rendered UI on failed persistence.
    activity.engine="DictationEngine";
    const dictationEngine={
      activity:{id:"old-dictation"},content:{questions:[{id:"old-question"}]},
      state:{started:false,currentIndex:0,totalQuestions:0},runToken:null,finishAuthorized:false,
      restoreSession(state){this.state={...state};return true;},
      getState(){return this.state;}
    };
    window.EngineManager={getEngine(name){return name==="DictationEngine"?dictationEngine:null;}};
    window.DictationScreen={render(state){
      document.getElementById("app").innerHTML="dictationScreen:restored-dictation:"+state.currentIndex;
    }};
    const dictationSession=validSession();
    dictationSession.activityType="DictationEngine";
    dictationSession.engineState={kind:"dictation",activity,content:{questions:[{id:"dictation-question-1"}]},
      state:{started:true,currentIndex:2,totalQuestions:5,correct:2,wrong:0}};
    d.raw=JSON.stringify(dictationSession);d.failSave=true;
    manager.currentSession=null;manager.gameplayActive=false;manager.getResumable=()=>dictationSession;
    ActivityManager.currentActivity=null;ActivityState.value="idle";
    document.body.classList.remove("activity-playing");EventManager.events.length=0;
    document.getElementById("app").innerHTML="previous-screen";
    const dictationReturned=await manager.resume(activity.id);
    const dictationPersisted=JSON.parse(d.raw);
    const dictationEvents=EventManager.events.filter(event=>event.name==="activityResumed").length;
    const dictationLeaked=manager.gameplayActive===true && document.body.classList.contains("activity-playing") &&
      ActivityManager.currentActivity===activity && ActivityState.value==="playing" && dictationEvents===1 &&
      document.getElementById("app").innerHTML==="dictationScreen:restored-dictation:2" &&
      dictationEngine.state.currentIndex===2;
    record("R7 real Dictation restore branch leaks UI/activity when persistence fails",
      dictationReturned===true && dictationSession.status==="active" && dictationPersisted.status==="resumable" && dictationLeaked,
      "observed returned="+dictationReturned+", status="+dictationSession.status+", persisted="+dictationPersisted.status+", gameplayActive="+manager.gameplayActive+", css="+document.body.classList.contains("activity-playing")+", currentActivity="+(ActivityManager.currentActivity===activity)+", activityState="+ActivityState.value+", events="+dictationEvents+", markup="+document.getElementById("app").innerHTML+", currentIndex="+dictationEngine.state.currentIndex);
    d.failSave=false;

    // R8 loads the actual WordPuzzleEngine and exercises the real manager restore branch.
    activity.engine="WordPuzzleEngine";
    const wordPuzzleEngine=window.WordPuzzleEngine;
    window.EngineManager={getEngine(name){return name==="WordPuzzleEngine"?wordPuzzleEngine:null;}};
    wordPuzzleEngine.activity={id:"old-word-puzzle"};
    wordPuzzleEngine.state={started:false,finished:false,round:0,total:1,correct:0,wrong:0,score:0,foundWords:[]};
    wordPuzzleEngine.round={type:"old-round",words:[]};
    const wordPuzzleSession=validSession();
    wordPuzzleSession.activityType="WordPuzzleEngine";
    wordPuzzleSession.engineState={kind:"wordPuzzle",activity,state:{started:true,finished:false,round:2,total:5,
      correct:2,wrong:1,score:40,hints:1,hintPenalty:5,foundWords:["آموزش"]},
      round:{type:"wordSearch",words:[{id:"word-1",word:"دانش"}],grid:[["د","ا","ن","ش"]]}};
    d.raw=JSON.stringify(wordPuzzleSession);d.failSave=true;
    manager.currentSession=null;manager.gameplayActive=false;manager.getResumable=()=>wordPuzzleSession;
    ActivityManager.currentActivity=null;ActivityState.value="idle";
    document.body.classList.remove("activity-playing");EventManager.events.length=0;
    document.getElementById("app").innerHTML="previous-screen";
    const wordPuzzleReturned=await manager.resume(activity.id);
    const wordPuzzlePersisted=JSON.parse(d.raw);
    const wordPuzzleEvents=EventManager.events.filter(event=>event.name==="activityResumed").length;
    const wordPuzzleLeaked=manager.gameplayActive===true && document.body.classList.contains("activity-playing") &&
      ActivityManager.currentActivity===activity && ActivityState.value==="playing" && wordPuzzleEvents===1 &&
      wordPuzzleEngine.state.round===2 && wordPuzzleEngine.state.score===40 &&
      wordPuzzleEngine.round.type==="wordSearch" && wordPuzzleEngine.round.words[0].word==="دانش";
    record("R8 actual WordPuzzleEngine restore branch leaks activity/state when persistence fails",
      wordPuzzleReturned===true && wordPuzzleSession.status==="active" && wordPuzzlePersisted.status==="resumable" && wordPuzzleLeaked,
      "observed returned="+wordPuzzleReturned+", status="+wordPuzzleSession.status+", persisted="+wordPuzzlePersisted.status+", gameplayActive="+manager.gameplayActive+", css="+document.body.classList.contains("activity-playing")+", currentActivity="+(ActivityManager.currentActivity===activity)+", activityState="+ActivityState.value+", resumedEvents="+wordPuzzleEvents+", round="+wordPuzzleEngine.state.round+", score="+wordPuzzleEngine.state.score+", roundType="+wordPuzzleEngine.round.type);
    d.failSave=false;
  }catch(error){results.push({name:"Harness execution",reproduced:false,detail:error.stack||error.message});}
  const list=document.querySelector("#results");
  results.forEach(item=>{const li=document.createElement("li");li.textContent=(item.reproduced?"BLOCKER CONFIRMED — ":"NOT REPRODUCED — ")+item.name+" — "+item.detail;list.appendChild(li);});
  const reproduced=results.filter(x=>x.reproduced).length;
  document.querySelector("#summary").textContent=reproduced+"/"+results.length+" resume transaction failure diagnostics reproduced";
  window.__resumeTransactionDiagnostic={reproduced,total:results.length,results};
})();
</script></body></html>
