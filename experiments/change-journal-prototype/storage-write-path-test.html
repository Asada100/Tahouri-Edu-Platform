<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Storage Write Path Audit</title><style>body{font-family:Tahoma,Arial,sans-serif;max-width:900px;margin:28px auto;padding:0 16px;line-height:1.8}#summary{font-weight:bold;margin:16px 0}.pass{color:#087443}.fail{color:#b42318}li{padding:4px 0}code{direction:ltr;display:inline-block}</style></head><body>
<h1>آزمون مسیرهای واقعی ذخیره‌سازی هشت مجموعه</h1><p>فقط در مرورگر Chromium ایزولهٔ CI اجرا شود. شناسه‌های ساختگی <code>__CJ_AUDIT_*</code> دارد؛ به پروفایل واقعی متصل نیست. هیچ Change Journal یا همگام‌سازی شبکه‌ای اجرا نمی‌شود.</p><div id="summary">در حال آماده‌سازی…</div><ol id="results"></ol>
<script>
(function(){'use strict';let studentId='__CJ_AUDIT_A__';const events={};
window.ProfileContext={key(base){return base+':'+studentId;},getStudentId(){return studentId;}};
window.ProfileManager={getStudentId(){return studentId;},get(){return {studentId,grade:'grade6'};}};
window.SaveManager={load(key){try{return JSON.parse(localStorage.getItem(key)||'null');}catch(_){return null;}},save(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true;}catch(_){return false;}},remove(key){localStorage.removeItem(key);return true;}};
window.EventManager={on(name,fn){(events[name]||(events[name]=[])).push(fn);},off(name,fn){events[name]=(events[name]||[]).filter(x=>x!==fn);},emit(name,value){(events[name]||[]).slice().forEach(fn=>fn(value));}};
window.StudentLearningSync={schedule(){}};window.AppState={grade:'grade6'};window.App={activities:[]};
window.fetch=async function(url){if(String(url).includes('data/contentLocks.json'))return {ok:true,json:async()=>[{id:'audit-lock',locked:true}]};throw new Error('Unexpected network request: '+url);};
})();
</script>
<script src="../../engine/progress/progressTracker.js"></script><script src="../../engine/core/contentLockManager.js"></script><script src="../../engine/core/statisticsManager.js"></script><script src="../../engine/core/dailyLearningStreak.js"></script><script src="../../engine/core/notificationStore.js"></script><script src="../../engine/question/questionPerformanceManager.js"></script><script src="../../engine/question/spellingPerformanceStore.js"></script>
<script>
(async function(){'use strict';const results=document.getElementById('results'),summary=document.getElementById('summary'),checks=[];let studentId='__CJ_AUDIT_A__';
function assert(v,m){if(!v)throw new Error(m||'assertion failed');}function read(k){const x=localStorage.getItem(k);return x===null?null:JSON.parse(x);}function add(n,f){checks.push([n,f]);}
const k={progress:'Tahouri_Progress:__CJ_AUDIT_A__',statistics:'Tahouri_Statistics:__CJ_AUDIT_A__',locks:'Tahouri_ContentLocks:__CJ_AUDIT_A__',parity:'Tahouri_EvenOddProgression_v2:__CJ_AUDIT_A__',streak:'tahouri_daily_learning_streak:__CJ_AUDIT_A__',notifications:'tahouri_notifications:__CJ_AUDIT_A__',spelling:'Tahouri_Spelling_Performance:__CJ_AUDIT_A__',question:'Tahouri_QuestionPerformance:__CJ_AUDIT_A__'};
try{await window.ContentLockManager.waitUntilReady();
add('پیشرفت: update در کلید پروفایل‌دار ذخیره می‌شود',()=>{window.ProgressTracker.update('audit-activity',{score:8,percentage:80,completed:true});assert(read(k.progress)['audit-activity'].played,'progress missing');});
add('آمار: addResult شمارنده‌ها را تغییر و ذخیره می‌کند',()=>{assert(window.StatisticsManager.addResult({id:'audit-activity',subject:'math',grade:'grade6',chapter:'chapter1'},{score:8,correct:4,wrong:1,percentage:80}),'statistics save failed');assert(read(k.statistics).activities['grade6:math:chapter1:audit-activity'].totalActivities===1,'aggregate missing');});
add('قفل محتوا: lock/unlock از saveLocks ذخیره می‌شود',()=>{assert(window.ContentLockManager.unlock('audit-lock'),'unlock failed');assert(read(k.locks)['audit-lock']===false,'unlock not persisted');assert(window.ContentLockManager.lock('audit-lock'),'lock failed');assert(read(k.locks)['audit-lock']===true,'lock not persisted');});
add('پیشرفت زوج‌وفرد: نتیجهٔ ۸۰٪ شناسهٔ بعدی را ثبت می‌کند',()=>{assert(window.ContentLockManager.recordProgressionResult('evenOdd',80),'progression failed');assert(read(k.parity).unlocked.includes('parityTrain'),'next item missing');});
add('تداوم روزانه: recordActivity رخداد جدید می‌افزاید',()=>{window.DailyLearningStreak.recordActivity({id:'audit-activity',subject:'math',title:'Audit'},{score:8,percentage:80,stars:4});const day=read(k.streak).days[window.DailyLearningStreak.today()];assert(day.activities.length===1&&day.activityCount===1,'streak event missing');});
add('اعلان: add و markRead ذخیره می‌شوند',()=>{const item=window.NotificationStore.add({id:'audit-notification',title:'Audit'});assert(read(k.notifications)[0].id===item.id,'notification missing');assert(window.NotificationStore.markRead(item.id),'markRead failed');assert(read(k.notifications)[0].read===true,'read state missing');});
add('اعلان: clear حذف فیزیکی و بدون tombstone است',()=>{window.NotificationStore.clear();assert(localStorage.getItem(k.notifications)===null,'notification key remains');});
add('املا: recordSession پاسخ را append می‌کند و شناسهٔ پایدار ندارد',()=>{assert(window.SpellingPerformanceStore.recordSession({activityId:'audit-spelling',answers:[{questionIndex:0,target:'کتاب',completed:true,correct:true}],targetAnswers:[]}),'spelling save failed');const x=read(k.spelling).answers[0];assert(x.activityId==='audit-spelling'&&x.questionIndex===0,'answer missing');assert(!x.answerId&&!x.id,'stable answer ID unexpectedly present');});
add('عملکرد سؤال: record شمارندهٔ تلاش را مستقیم افزایش می‌دهد',()=>{window.QuestionPerformanceManager.currentActivityId='audit-activity';assert(window.QuestionPerformanceManager.record({text:'2+2',difficulty:'easy'},true),'question save failed');const a=Object.values(read(k.question));assert(a.length===1&&a[0].attempts===1&&a[0].correct===1,'question counters missing');});
add('جداسازی پروفایل: دادهٔ پروفایل دوم جدا ذخیره می‌شود',()=>{const first=read(k.progress);studentId='__CJ_AUDIT_B__';window.ProfileContext.getStudentId=()=>studentId;window.ProfileContext.key=base=>base+':'+studentId;window.ProgressTracker.update('second-profile-activity',{score:5,percentage:50});const second=read('Tahouri_Progress:__CJ_AUDIT_B__');assert(first['audit-activity']&&second['second-profile-activity'],'profile isolation failed');assert(read(k.progress)['audit-activity'].played,'first profile changed');});
}catch(e){checks.push(['آماده‌سازی ماژول‌ها',()=>{throw e;}]);}
let passed=0;for(const [name,fn] of checks){const li=document.createElement('li');try{fn();li.textContent='موفق — '+name;li.className='pass';passed++;}catch(e){li.textContent='ناموفق — '+name+' — '+e.message;li.className='fail';}results.appendChild(li);}summary.textContent=passed+'/'+checks.length+' آزمون موفق';summary.className=passed===checks.length?'pass':'fail';window.__storageWritePathResult={passed,total:checks.length,lines:[...results.querySelectorAll('li')].map(x=>x.textContent)};
})();
</script></body></html>
