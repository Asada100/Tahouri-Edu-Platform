<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آزمون چندمرحله‌ای دسته‌بندی</title>
<style>
body{font-family:Tahoma,sans-serif;max-width:850px;margin:24px auto;padding:16px;line-height:1.9}
#result{white-space:pre-wrap;background:#f4f4f4;border-radius:10px;padding:16px;direction:ltr;text-align:left}
.pass{color:#176b35}.fail{color:#a01818}
</style>
</head>
<body>
<h1>آزمون موتور دسته‌بندی چندمرحله‌ای</h1>
<p>این صفحه، اعتبارسنجی داده، جابه‌جایی مرحله، تلاش مجدد، امتیاز و پایان فعالیت را بدون تغییر محتوای اصلی بررسی می‌کند.</p>
<pre id="result">در حال اجرای آزمون…</pre>
<script src="../engine/activity/activityResult.js"></script>
<script src="../engine/question/classificationProvider.js"></script>
<script src="../engine/activity/classificationTypes/classificationTypeRegistry.js"></script>
<script src="../engine/activity/classificationTypes/choiceClassification.js"></script>
<script src="../engine/activity/classificationTypes/multiStageClassification.js"></script>
<script src="../engine/activity/classificationEngine.js"></script>
<script>
(function(){
  const output=document.getElementById('result');
  const checks=[];
  function assert(name,condition,detail){
    checks.push({name,passed:!!condition,detail:detail||''});
    if(!condition) throw new Error(name+(detail?': '+detail:''));
  }
  const activity={
    id:'multiStageClassificationRuntimeTest',
    title:'آزمون چندمرحله‌ای',
    settings:{scorePerCorrect:10,allowRetry:true},
    classification:{
      mode:'multiStage',
      instruction:'هر مورد را دسته‌بندی کن.',
      stages:[
        {id:'stage-1',title:'مرحله اول',mode:'choice',instruction:'مرحله اول را حل کن.',
          categories:[{id:'living',title:'زنده'},{id:'nonliving',title:'غیرزنده'}],
          items:[{id:'cat',content:'گربه',categoryId:'living'},{id:'stone',content:'سنگ',categoryId:'nonliving'}]},
        {id:'stage-2',title:'مرحله دوم',mode:'dragDrop',instruction:'مرحله دوم را حل کن.',
          categories:[{id:'plant',title:'گیاه'},{id:'animal',title:'جانور'}],
          items:[{id:'rose',content:'گل رز',categoryId:'plant'}]}
      ]
    }
  };
  try{
    const normalized=ClassificationProvider.getContent(activity);
    assert('provider detects multiStage',normalized.mode==='multiStage');
    assert('provider keeps both stages',normalized.stages.length===2);
    ClassificationEngine.start(activity);
    let state=ClassificationEngine.getState();
    assert('starts at stage zero',state.currentStage===0);
    assert('counts all stage items',state.totalItems===3);

    let result=ClassificationEngine.classifyItem('cat','living');
    assert('first correct answer counted',result.correct===true);
    result=ClassificationEngine.classifyItem('stone','nonliving');
    assert('advances after first stage',result.stageCompleted===true && result.currentStage===1);
    state=ClassificationEngine.getState();
    assert('stage two items loaded',state.items.length===1 && state.items[0].id==='rose');
    assert('stage progress reset',state.classifiedItems===0 && state.stageCompleted===1);
    assert('total progress preserved',state.totalClassifiedItems===2 && state.correctAnswers===2);

    const saved=ClassificationEngine.getSessionState();
    const restored=ClassificationEngine.restoreSession(saved);
    assert('restores active second stage',restored===true && ClassificationEngine.getState().currentStage===1);

    result=ClassificationEngine.classifyItem('rose','animal');
    assert('wrong answer allows retry',result.correct===false && result.retryAllowed===true);
    state=ClassificationEngine.getState();
    assert('retry does not consume item',state.classifiedItems===0 && state.finished===false);

    result=ClassificationEngine.classifyItem('rose','plant');
    state=ClassificationEngine.getState();
    const finalResult=ClassificationEngine.getResult();
    assert('last stage completes',state.finished===true && !!finalResult);
    assert('all correct answers counted',finalResult.correctAnswers===3);
    assert('wrong attempt retained',finalResult.wrongAnswers===1);
    assert('score uses correct answers only',finalResult.score===30);
    assert('percentage based on all items',finalResult.percentage===100);
    assert('completion reports three questions',finalResult.totalQuestions===3);

    let invalidRejected=false;
    try{ClassificationProvider.validate({mode:'multiStage',stages:[]});}
    catch(e){invalidRejected=true;}
    assert('rejects empty stage list',invalidRejected);

    invalidRejected=false;
    try{ClassificationProvider.validate({mode:'multiStage',stages:[{
      categories:[{id:'a',title:'الف'}],
      items:[{id:'bad',content:'مورد',categoryId:'missing'}]
    }]});}
    catch(e){invalidRejected=true;}
    assert('rejects unknown category reference',invalidRejected);

    output.className='pass';
    output.textContent='PASS — '+checks.filter(x=>x.passed).length+' checks\n\n'+JSON.stringify(checks,null,2);
    console.log('MULTI-STAGE CLASSIFICATION TEST PASS',checks);
  }catch(error){
    output.className='fail';
    output.textContent='FAIL\n'+error.message+'\n\n'+JSON.stringify(checks,null,2);
    console.error('MULTI-STAGE CLASSIFICATION TEST FAIL',error,checks);
  }finally{
    ClassificationEngine.reset();
  }
})();
</script>
</body>
</html>
